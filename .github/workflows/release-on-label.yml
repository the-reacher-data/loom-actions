name: release-on-label

# Merging a pull request that carries the release label publishes everything
# merged since the last tag. Publishing to PyPI is opt-in: a repository that
# ships an application, not a package, gets the tag, the notes and the GitHub
# release, and never builds a distribution.
on:
  workflow_call:
    inputs:
      release-label:
        description: "Label that authorises a release when its pull request merges"
        required: false
        type: string
        default: "release"
      base-branch:
        description: "Branch the release is cut from"
        required: false
        type: string
        default: "master"
      publish-to-pypi:
        description: "Build a distribution and publish it to PyPI"
        required: false
        type: boolean
        default: false
      package-name:
        description: "Distribution name, required when publishing, to check the built version"
        required: false
        type: string
        default: ""
      python-version:
        required: false
        type: string
        default: "3.11"
      uv-version:
        required: false
        type: string
        default: "0.10.2"
      merge-sha:
        description: "Commit to release, for a caller resuming a run that stopped halfway"
        required: false
        type: string
        default: ""

jobs:
  plan:
    if: >-
      ${{ inputs.merge-sha != ''
          || (github.event.pull_request.merged == true
              && contains(github.event.pull_request.labels.*.name, inputs.release-label)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release_sha: ${{ env.MERGE_SHA }}
    env:
      MERGE_SHA: ${{ inputs.merge-sha != '' && inputs.merge-sha || github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.base-branch }}
          persist-credentials: false

      - name: Require the release commit on the base branch
        shell: bash
        env:
          BASE_BRANCH: ${{ inputs.base-branch }}
        run: |
          set -euo pipefail
          if [[ ! "${MERGE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release commit is not a full SHA: ${MERGE_SHA}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${MERGE_SHA}" "origin/${BASE_BRANCH}"; then
            echo "Release commit ${MERGE_SHA} is not on ${BASE_BRANCH}."
            exit 1
          fi

      - name: Require a package name when publishing
        if: ${{ inputs.publish-to-pypi && inputs.package-name == '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "publish-to-pypi needs package-name to check the built version against the tag."
          exit 1

      - name: Plan the release
        id: plan
        uses: the-reacher-data/loom-actions/actions/release/plan-release@master
        with:
          merge-sha: ${{ env.MERGE_SHA }}
          repository-slug: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Store release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: CHANGELOG_RELEASE.md
          if-no-files-found: error
          retention-days: 1

      # Before the build, because a version derived from the tag needs the tag to
      # exist. Idempotent, so a halted release can be re-run.
      - name: Create the immutable version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_REF="refs/tags/v${VERSION}"
          TAGS=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${VERSION}")
          TAG_COUNT=$(jq --arg ref "${TAG_REF}" '[.[] | select(.ref == $ref)] | length' <<< "${TAGS}")

          if [ "${TAG_COUNT}" -gt 1 ]; then
            echo "GitHub returned duplicate exact refs for ${TAG_REF}."
            exit 1
          elif [ "${TAG_COUNT}" -eq 1 ]; then
            REMOTE_SHA=$(jq -r --arg ref "${TAG_REF}" '.[] | select(.ref == $ref) | .object.sha' <<< "${TAGS}")
            if [ "${REMOTE_SHA}" != "${MERGE_SHA}" ]; then
              echo "Tag v${VERSION} points to ${REMOTE_SHA}, expected ${MERGE_SHA}."
              exit 1
            fi
            echo "Tag v${VERSION} already points at the release commit."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="${TAG_REF}" \
              -f sha="${MERGE_SHA}"
          fi

  build:
    needs: plan
    if: ${{ inputs.publish-to-pypi }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PACKAGE_NAME: ${{ inputs.package-name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: v${{ needs.plan.outputs.version }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install pinned uv
        shell: bash
        env:
          UV_VERSION: ${{ inputs.uv-version }}
        run: |
          pip install --only-binary :all: "uv==${UV_VERSION}"

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run --frozen --with "build==1.3.0" python -m build
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Package build modified tracked files."
            git status --short --untracked-files=no
            exit 1
          fi

      # A version other than the tag's means the build never saw the tag, and
      # publishing it would burn a version on an immutable index.
      - name: Require the built version to match the tag
        shell: bash
        run: |
          set -euo pipefail
          normalised="${PACKAGE_NAME//-/_}"
          if [ ! -f "dist/${normalised}-${VERSION}-py3-none-any.whl" ]; then
            echo "Built distributions do not carry version ${VERSION}:"
            ls -1 dist
            exit 1
          fi

      - name: Store distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [plan, build]
    if: ${{ always() && needs.plan.result == 'success' && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_SHA: ${{ needs.plan.outputs.release_sha }}
    steps:
      - name: Download release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes

      - name: Download distributions
        if: ${{ inputs.publish-to-pypi }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist

      - name: Update floating major tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          MAJOR=${VERSION%%.*}
          MAJOR_REF="refs/tags/v${MAJOR}"
          TAGS=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${MAJOR}")
          MAJOR_COUNT=$(jq --arg ref "${MAJOR_REF}" '[.[] | select(.ref == $ref)] | length' <<< "${TAGS}")

          if [ "${MAJOR_COUNT}" -gt 1 ]; then
            echo "GitHub returned duplicate exact refs for ${MAJOR_REF}."
            exit 1
          elif [ "${MAJOR_COUNT}" -eq 1 ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v${MAJOR}" \
              -f sha="${RELEASE_SHA}" \
              -F force=true
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="${MAJOR_REF}" \
              -f sha="${RELEASE_SHA}"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          name: v${{ needs.plan.outputs.version }}
          body_path: CHANGELOG_RELEASE.md

      # Trusted publishing: the index mints a token for this repository and this
      # workflow, for this run. There is no credential to leak or rotate.
      - name: Publish package to PyPI
        if: ${{ inputs.publish-to-pypi }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 2026-07-28 (handles Metadata-Version 2.5)
